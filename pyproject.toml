[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-auditor"
version = "1.2.0"
description = "Local-first blockchain project audit orchestrator"
requires-python = ">=3.11"

[project.scripts]
blockchain-auditor = "blockchain_auditor.cli:main"

[project.optional-dependencies]
dev = ["coverage>=7.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blockchain_auditor = ["web/*", "rules/*", "knowledge/*"]
